# --- Type sets ----------------------------------------------------------------------------------------

# Source Serif 4 for headings over Source Sans 3 and Lilex (0086 A4), named `default26` on 2026-10-17; it was Newsreader
# over IBM Plex Sans and IBM Plex Mono (0034 A8) until 2026-10-27.
[typeset.default26]
label = "Source"                     # James, 2026-10-28; the name stays `default26`
font-family-base = "'Source Sans 3', system-ui, sans-serif"
font-family-heading-main = "'Source Serif 4', Georgia, 'Times New Roman', serif"
font-family-monospace = "'Lilex', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.default26.font]]
family = "Source Serif 4"
weights = [400, 500]
licence = "OFL-1.1"

[[typeset.default26.font]]
family = "Source Sans 3"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.default26.font]]
family = "Lilex"
weights = [400, 500]
licence = "OFL-1.1"

# An accessibility type set (0086 §3): a reader may always choose it, whatever a tenant restricts.
# Atkinson Hyperlegible, by the Braille Institute, as released on Google Fonts under the OFL; the licence of
# the files bundled is checked when they are added to the build.
[typeset.hyperlegible]
label = "Hyperlegible"
accessibility = true
font-family-base = "'Atkinson Hyperlegible', system-ui, sans-serif"
font-family-heading-main = "'Atkinson Hyperlegible', system-ui, sans-serif"
font-family-monospace = "'IBM Plex Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.hyperlegible.font]]
family = "Atkinson Hyperlegible"
weights = [400, 700]
licence = "OFL-1.1"

[[typeset.hyperlegible.font]]
family = "IBM Plex Mono"
weights = [400, 500]
licence = "OFL-1.1"

# A type set for readers with dyslexia (0086 §3), shipped first of several options (James, 2026-10-17).
# OpenDyslexic, by Abbie Gonzalez, under the SIL OFL 1.1. Studies have not shown it to speed reading; readers
# who prefer it ask for it by name.
[typeset.opendyslexic]
label = "OpenDyslexic"
accessibility = true
font-family-base = "'OpenDyslexic', system-ui, sans-serif"
font-family-heading-main = "'OpenDyslexic', system-ui, sans-serif"
font-family-monospace = "'OpenDyslexic Mono', 'IBM Plex Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.opendyslexic.font]]
family = "OpenDyslexic"
weights = [400, 700]
licence = "OFL-1.1"

[[typeset.opendyslexic.font]]
family = "OpenDyslexic Mono"
weights = [400]
licence = "OFL-1.1"

# Vector 2022's default stacks on Wikimedia wikis, named `basic` (James, 2026-10-25; 0086 A2), as MediaWiki
# core's mediawiki.skin.defaults.less and mediawiki.skinning/elements.less give them: the device's sans-serif
# for text, Linux Libertine or the nearest installed serif for headings, and the device's monospace for code,
# doubled as MediaWiki doubles it so browsers do not shrink it (T176636). It serves no typeface.
[typeset.basic]
label = "Basic"
font-family-base = "sans-serif"
font-family-heading-main = "'Linux Libertine', 'Georgia', 'Times', 'Source Serif Pro', serif"
font-family-monospace = "monospace, monospace"


# Bitter for headings over IBM Plex Sans and IBM Plex Mono: a slab serif and a sans with a typewriter's
# heritage, made for the palette `gruvbox` (2026-11-01). IBM Plex Mono is `hyperlegible`'s.
[typeset.retro]
label = "Retro"
font-family-base = "'IBM Plex Sans', system-ui, sans-serif"
font-family-heading-main = "'Bitter', Georgia, 'Times New Roman', serif"
font-family-monospace = "'IBM Plex Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.retro.font]]
family = "Bitter"
weights = [400, 500]
licence = "OFL-1.1"

[[typeset.retro.font]]
family = "IBM Plex Sans"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.retro.font]]
family = "IBM Plex Mono"
weights = [400, 500]
licence = "OFL-1.1"

# Rubik for headings over Inter and JetBrains Mono: a softly rounded geometric sans, the face of Nord's own
# site, over a neutral text sans, made for the palette `nord` (2026-11-01).
[typeset.nordic]
label = "Nordic"
font-family-base = "'Inter', system-ui, sans-serif"
font-family-heading-main = "'Rubik', system-ui, sans-serif"
font-family-monospace = "'JetBrains Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.nordic.font]]
family = "Rubik"
weights = [400, 500]
licence = "OFL-1.1"

[[typeset.nordic.font]]
family = "Inter"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.nordic.font]]
family = "JetBrains Mono"
weights = [400, 500]
licence = "OFL-1.1"

# Fraunces for headings over Nunito and Lilex: a soft, old-style serif over a rounded sans, made for the
# palette `catppuccin` (2026-11-01). Lilex is `default26`'s.
[typeset.cozy]
label = "Cozy"
font-family-base = "'Nunito', system-ui, sans-serif"
font-family-heading-main = "'Fraunces', Georgia, 'Times New Roman', serif"
font-family-monospace = "'Lilex', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.cozy.font]]
family = "Fraunces"
weights = [400, 500]
licence = "OFL-1.1"

[[typeset.cozy.font]]
family = "Nunito"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.cozy.font]]
family = "Lilex"
weights = [400, 500]
licence = "OFL-1.1"

# VT323 for headings over Overpass and Overpass Mono: a terminal's bitmap face, at heading sizes only, over a
# technical sans after the US road-sign lettering, made for the palette `greenbar` (2026-11-01). VT323 has
# one weight and covers Latin alone; other scripts in headings fall through to the rest of the stack.
[typeset.mainframe]
label = "Mainframe"
font-family-base = "'Overpass', system-ui, sans-serif"
font-family-heading-main = "'VT323', 'Overpass Mono', Menlo, Consolas, monospace"
font-family-monospace = "'Overpass Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.mainframe.font]]
family = "VT323"
weights = [400]
licence = "OFL-1.1"

[[typeset.mainframe.font]]
family = "Overpass"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.mainframe.font]]
family = "Overpass Mono"
weights = [400, 500]
licence = "OFL-1.1"

# Barlow Condensed for headings over Barlow and JetBrains Mono: a grotesk after the lettering of road signs
# and drawing title blocks, narrow for headings as a draughtsman's capitals are, made for the palette
# `cyanotype` (2026-11-01). JetBrains Mono is `nordic`'s.
[typeset.drafting]
label = "Drafting"
font-family-base = "'Barlow', system-ui, sans-serif"
font-family-heading-main = "'Barlow Condensed', 'Barlow', system-ui, sans-serif"
font-family-monospace = "'JetBrains Mono', Menlo, Consolas, monospace"
fallback = "noto"

[[typeset.drafting.font]]
family = "Barlow Condensed"
weights = [400, 500]
licence = "OFL-1.1"

[[typeset.drafting.font]]
family = "Barlow"
weights = [400, 500, 600]
licence = "OFL-1.1"

[[typeset.drafting.font]]
family = "JetBrains Mono"
weights = [400, 500]
licence = "OFL-1.1"


# --- Fallback layers ----------------------------------------------------------------------------------

# Noto, by Google, for every script in Wikimedia's language data (@wikimedia/language-data 2.0.4) apart from
# Latin, Greek and Cyrillic, which the type sets serve and `Noto Sans` and `Noto Serif` back up; Chinese,
# Japanese and Korean, left to the device's fonts, which pick the regional forms by `lang`; and SignWriting,
# which needs a renderer rather than a font (0093 §2). Ordered by how many languages use the script. A script
# with no Noto serif uses its sans in headings; Tibetan has only a serif, used in every role. Weights 400 and
# 600, or 400 alone where the family has no 600. Noto Sans Math is left out: Fontsource ships its glyphs under
# a Basic Latin range, so they could not be reached.
