	{ family = "Noto Sans", weights = [400, 600], licence = "OFL-1.1", subsets = ["cyrillic-ext", "cyrillic", "greek-ext", "greek", "vietnamese", "latin-ext", "latin"], stacks = ["sans-serif"] },
