[package]
name = "triplespace-web"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The stateless web tier (ADR 0057): the site over the public API, deployable apart from the server"
publish = false

[[bin]]
name = "triplespace-web"
path = "src/main.rs"

[features]
# The process allocator (0033 §2, A24); off for the system allocator, for heap tools.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
triplespace-client.workspace = true
triplespace-ui.workspace = true
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
