[workspace]
resolver = "3"
members = [
    "crates/scatter-vocab",
    "crates/scatter-providers",
    "crates/scatter-normalize",
    "crates/scatter-wikibase-model",
    "crates/scatter-wikibase-shape",
    "crates/scatter-wikibase-changeset",
    "crates/scatter-wikibase-resolve",
    "crates/scatter-ingest",
    "crates/triplespace-api-ingest",
    "crates/scatter-adapter-mediawiki",
    "crates/scatter-adapter-wikibase",
    "crates/triplespace-accounts",
    "crates/triplespace-upstream",
    "crates/triplespace-notify",
    "crates/triplespace-api-action",
    "crates/triplespace-api-rest",
    "crates/triplespace-client",
    "crates/triplespace-ui",
    "crates/triplespace-web",
    "crates/triplespace-server",
    "crates/triplespace-cli",
    "crates/scatter-actors",
    "crates/scatter-challenge",
    "crates/scatter-log",
    "crates/scatter-integrity",
    "crates/scatter-log-postgres",
    "crates/triplespace-db",
    "crates/scatter-projection",
    "crates/triplespace-projections",
    "crates/scatter-pages",
    "crates/scatter-titles",
    "crates/scatter-wikitext",
    "crates/scatter-wikitext-expand",
    "crates/scatter-talk",
    "crates/scatter-talk-import",
    "crates/scatter-threads",
    "xtask",
]

# Crates are added here as they are built, in the order of ADR 0005 §7. The dependency
# graph between workspace crates is checked against the table in ADR 0005 §2 by
# `cargo xtask deps` (0005 §3, rule 1).

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/scatterbase/triplespace"
authors = ["Scatter LLC"]

[workspace.dependencies]
# Workspace crates
scatter-vocab = { path = "crates/scatter-vocab" }
scatter-providers = { path = "crates/scatter-providers" }
scatter-normalize = { path = "crates/scatter-normalize" }
scatter-wikibase-model = { path = "crates/scatter-wikibase-model" }
scatter-wikibase-shape = { path = "crates/scatter-wikibase-shape" }
scatter-wikibase-changeset = { path = "crates/scatter-wikibase-changeset" }
scatter-wikibase-resolve = { path = "crates/scatter-wikibase-resolve" }
scatter-ingest = { path = "crates/scatter-ingest" }
triplespace-api-ingest = { path = "crates/triplespace-api-ingest" }
triplespace-accounts = { path = "crates/triplespace-accounts" }
triplespace-upstream = { path = "crates/triplespace-upstream" }
triplespace-notify = { path = "crates/triplespace-notify" }
triplespace-api-action = { path = "crates/triplespace-api-action" }
triplespace-api-rest = { path = "crates/triplespace-api-rest" }
triplespace-server = { path = "crates/triplespace-server" }
triplespace-client = { path = "crates/triplespace-client" }
triplespace-ui = { path = "crates/triplespace-ui" }
triplespace-web = { path = "crates/triplespace-web" }
triplespace-cli = { path = "crates/triplespace-cli" }
scatter-adapter-mediawiki = { path = "crates/scatter-adapter-mediawiki" }
scatter-adapter-wikibase = { path = "crates/scatter-adapter-wikibase" }
scatter-actors = { path = "crates/scatter-actors" }
scatter-challenge = { path = "crates/scatter-challenge" }
scatter-log = { path = "crates/scatter-log" }
scatter-integrity = { path = "crates/scatter-integrity" }
scatter-log-postgres = { path = "crates/scatter-log-postgres" }
triplespace-db = { path = "crates/triplespace-db" }
triplespace-projections = { path = "crates/triplespace-projections" }
scatter-projection = { path = "crates/scatter-projection" }
scatter-pages = { path = "crates/scatter-pages" }
scatter-titles = { path = "crates/scatter-titles" }
scatter-wikitext = { path = "crates/scatter-wikitext" }
scatter-wikitext-expand = { path = "crates/scatter-wikitext-expand" }
scatter-talk = { path = "crates/scatter-talk" }
scatter-talk-import = { path = "crates/scatter-talk-import" }
scatter-threads = { path = "crates/scatter-threads" }

# RDF terms: the oxrdf family only (0005 §3, rule 5)
oxrdf = "0.3"

# Identifiers, URLs, case and normalization (0033 §9.3); all build for wasm32
idna = "1"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
icu_casemap = "2"
icu_plurals = "2"
icu_locale_core = "2"
# Only on wasm targets, with the `wasm_js` feature (see .cargo/config.toml)
getrandom = "0.3"

# Ordered maps for JSON objects whose order is data (qualifiers-order, snaks-order)
indexmap = { version = "2", features = ["serde"] }

# Wikibase's own hashes, reproduced for compatibility (0006 §2): SHA-1 for snaks and
# references, MD5 for RDF value nodes. Not used for anything Triplespace secures.
sha1 = "0.10"
md-5 = "0.10"
# Statement keys (0004 §8), signing-key IDs (0015 §1) and, later, the log's SHA-256 (0006 §2)
sha2 = "0.10"
# Password hashing (0033 §6: Argon2id) and keyed token derivation for sessions (0024 §4)
argon2 = "0.5"
hmac = "0.12"
# Canonical CBOR, hand-written to the core-deterministic rules over minicbor's primitives
# (0006 §2; 0033 §6)
minicbor = { version = "2", default-features = false, features = ["std", "half"] }

# Instance and client signatures (0033 §6; 0006 §6; 0024 §4)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# C2SP signed notes and checkpoints carry hashes and signatures in base64 (0006 §6)
base64 = "0.22"

# Registry files and configuration (0033 §12)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# HTML: the sanitizer the wikitext and markdown renderers share (0033 §9.1–9.2), and the
# HTML5 parser the golden tests normalize through. markup5ever_rcdom's newest release
# needs html5ever 0.39 while ammonia 4.2 uses 0.40; the second copy is a dev-dependency
# only. ammonia 4.2.4 or later: earlier releases have open advisories.
ammonia = "4.2.4"
# CommonMark for markdown pages and posts (0033 §9.2), without its CLI and highlighting.
comrak = { version = "0.43", default-features = false }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
toml = "1"

# Errors (0033 §14)
thiserror = "2"
anyhow = "1"

# Dumps (0033 §10): MediaWiki XML and Wikibase JSON dumps, gzip and bzip2 compressed
quick-xml = "0.41"
flate2 = "1"
bzip2 = "0.5"

# The CLI (0033 §13)
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# Driving async traits from synchronous tests (0005 rule 2: no runtime in the core)
pollster = "1"

# Postgres: the one async substrate crate (0005 rule 2; 0033 §4)
tokio = { version = "1", default-features = false }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
# Postgres over TLS when the database URL says `sslmode=require` (0033 A24): rustls on
# aws-lc-rs, the one crypto provider (0033 §6), with the platform's roots as the web tier uses
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
# The HTTP server (0033 §3): axum on hyper, tower middleware
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json", "matched-path"] }
tower = "0.5"
insta = "1"
http-body-util = "0.1"
# The web tier (0057): its HTTP client to the API, rustls on aws-lc-rs (0033 §6–7)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# Sealing secrets at rest (0088 §3): XChaCha20-Poly1305
chacha20poly1305 = "0.11"
# Server-rendered pages (0034 §2): compiled templates; the built frontend embedded (0034 §8)
# Without `config`, which reads an askama.toml (there is none) through the unmaintained
# basic-toml (RUSTSEC-2026-0374); `path = ` templates come with the derive regardless.
similar = { version = "2.7", default-features = false, features = ["text"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
rust-embed = { version = "8", features = ["include-exclude"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the ADRs' own naming and prose style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
